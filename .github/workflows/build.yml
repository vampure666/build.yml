name: Build Jarvis APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Write Jarvis project
        run: |
          bash p1.sh
          bash p2.sh
          bash p3.sh
          ls .ok1 .ok2 .ok3
      - name: Get offline wake-word model
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
